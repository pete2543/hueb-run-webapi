<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เลือกระยะ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="min-height: 920px; background: #0B1220; color: #F3F6FB; font-family: 'Noto Sans Thai', system-ui, sans-serif; line-height: 1.5">
<div style="max-width: 520px; margin: 0 auto; padding: 20px 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="กลับ" style="width: 44px; height: 44px; border-radius: 50%; background: #141D31; border: 1px solid #2A3857; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F6FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex-grow: 1">
<div style="font-size: 13px; color: #A3B0C8">ขั้นตอนที่ 1 จาก 4</div>
<div style="font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 20px">เลือกระยะ</div>
</div>
</div>

<div style="display: flex; gap: 6px">
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C6F432"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3857"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3857"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2A3857"></div>
</div>

<button type="button" onClick="{{pick3}}" style="position: relative; text-align: left; font: inherit; color: inherit; background: #141D31; border: 1px solid #2A3857; border-radius: 18px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; width: 100%; box-sizing: border-box">
<sc-if value="{{sel3}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: -1px; border: 2px solid #C6F432; border-radius: 18px; pointer-events: none"></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px">
<div style="font-family: 'Prompt', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #C6F432; width: 56px; text-align: center">3</div>
<div style="flex-grow: 1"><div style="font-weight: 600; font-size: 17px">Mini Run · 3 กม.</div><div style="font-size: 13px; color: #A3B0C8">เดิน-วิ่งเบา ๆ ทั้งครอบครัว</div></div>
<div style="text-align: right"><div style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 600">฿350</div><div style="font-size: 12px; color: #A3B0C8">Early bird ฿300</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; border-radius: 3px; background: #2A3857; overflow: hidden"><div style="width: 60%; height: 100%; background: #C6F432"></div></div>
<div style="font-size: 12px; color: #A3B0C8">เหลือ 120 จาก 300 ที่</div>
</div>
</button>

<button type="button" onClick="{{pick5}}" style="position: relative; text-align: left; font: inherit; color: inherit; background: #141D31; border: 1px solid #2A3857; border-radius: 18px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; width: 100%; box-sizing: border-box">
<sc-if value="{{sel5}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: -1px; border: 2px solid #C6F432; border-radius: 18px; pointer-events: none"></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px">
<div style="font-family: 'Prompt', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #C6F432; width: 56px; text-align: center">5</div>
<div style="flex-grow: 1"><div style="font-weight: 600; font-size: 17px">Fun Run · 5 กม.</div><div style="font-size: 13px; color: #A3B0C8">ก้าวแรกสำหรับสายสุขภาพ</div></div>
<div style="text-align: right"><div style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 600">฿450</div><div style="font-size: 12px; color: #A3B0C8">Early bird ฿400</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; border-radius: 3px; background: #2A3857; overflow: hidden"><div style="width: 68%; height: 100%; background: #C6F432"></div></div>
<div style="font-size: 12px; color: #A3B0C8">เหลือ 160 จาก 500 ที่</div>
</div>
</button>

<button type="button" onClick="{{pick10}}" style="position: relative; text-align: left; font: inherit; color: inherit; background: #141D31; border: 1px solid #2A3857; border-radius: 18px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 14px; width: 100%; box-sizing: border-box">
<sc-if value="{{sel10}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: -1px; border: 2px solid #C6F432; border-radius: 18px; pointer-events: none"></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px">
<div style="font-family: 'Prompt', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.1; color: #C6F432; width: 56px; text-align: center">10</div>
<div style="flex-grow: 1"><div style="font-weight: 600; font-size: 17px">Challenge · 10 กม.</div><div style="font-size: 13px; color: #A3B0C8">ท้าทายตัวเองให้ถึงเส้นชัย</div></div>
<div style="text-align: right"><div style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 600">฿600</div><div style="font-size: 12px; color: #A3B0C8">Early bird ฿550</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; border-radius: 3px; background: #2A3857; overflow: hidden"><div style="width: 93%; height: 100%; background: #FF7A59"></div></div>
<div style="font-size: 12px; color: #FF7A59">ใกล้เต็ม เหลือ 28 จาก 400 ที่</div>
</div>
</button>

<div style="display: flex; align-items: center; gap: 14px; background: #141D31; border: 1px solid #2A3857; border-radius: 18px; padding: 16px; margin-top: 8px">
<div style="flex-grow: 1">
<div style="font-size: 13px; color: #A3B0C8">ระยะที่เลือก</div>
<div style="font-weight: 600">{{picked.label}}</div>
</div>
<div style="font-family: 'Prompt', sans-serif; font-size: 24px; font-weight: 600">฿{{picked.price}}</div>
</div>

<a href="Runners.dc.html" style="width: 100%; box-sizing: border-box; min-height: 56px; border-radius: 16px; background: #C6F432; color: #0B1220; font-family: 'Prompt', sans-serif; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center">ถัดไป · ข้อมูลนักวิ่ง</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (this.state && this.state.picked) || '5';
    const data = {
      '3': { label: 'Mini Run · 3 กม.', price: '350' },
      '5': { label: 'Fun Run · 5 กม.', price: '450' },
      '10': { label: 'Challenge · 10 กม.', price: '600' }
    };
    return {
      sel3: p === '3',
      sel5: p === '5',
      sel10: p === '10',
      pick3: () => this.setState({ picked: '3' }),
      pick5: () => this.setState({ picked: '5' }),
      pick10: () => this.setState({ picked: '10' }),
      picked: data[p]
    };
  }
}
</script>
</body>
</html>
